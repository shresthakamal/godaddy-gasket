name: Release

on:
  push:
    branches:
      - main

permissions:
  id-token: write # This is required for GitHub to issue OIDC tokens
  contents: write
  pull-requests: write  # Allow PR creation
  packages: write

env:
  AWS_REGION: us-west-2

jobs:
  release:
    name: Release
    runs-on:
      group: 6216-uxpci0
      labels: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          # PAT needed so the changesets push triggers CI on the Version Packages PR
          token: ${{ secrets.GD_REPO_PAT }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4.1.0 # TODO: upgrade to v5+ when pnpm/action-setup#234 is fixed (v6 requires npm on PATH)

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Get Artifactory Read-Only Token
        uses: jfrog/setup-jfrog-cli@1641575d87647fb969c0545f0b6a76873e328b7c # v5.0.0
        id: jfrog
        env:
          JF_URL: ${{ vars.JF_URL }} # This variable is configured org wide
        with:
          oidc-provider-name: github

      - name: Install Dependencies
        run: pnpm install --prefer-offline
        env:
          ARTIFACTORY_TOKEN: ${{ steps.jfrog.outputs.oidc-token }}
          NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/.npmrc.gha

      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@6a0a831ff30acef54f2c6aa1cbbc1096b066edaf # v1.7.0 (enterprise allowlist approved)
        with:
          version: pnpm run version
        env:
          # changesets/action reads this env var for GitHub API and git auth
          GITHUB_TOKEN: ${{ secrets.GD_REPO_PAT }}

      - name: Trigger Publish Workflow
        if: steps.changesets.outputs.hasChangesets == 'false'
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: run-publish
