name: Syncpack

on:
  workflow_dispatch:
  pull_request:

permissions:
  id-token: write # This permission is required for OIDC access
  contents: read

env:
  AWS_REGION: us-west-2

# Cancel in-flight syncpack runs for the same PR
concurrency:
  group: syncpack-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  syncpack:
    runs-on:
      group: 6216-uxpci0
      labels: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4.1.0 # TODO: upgrade to v5+ when pnpm/action-setup#234 is fixed (v6 requires npm on PATH)

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Get Artifactory Read-Only Token
        uses: jfrog/setup-jfrog-cli@1641575d87647fb969c0545f0b6a76873e328b7c # v5.0.0
        id: jfrog
        env:
          JF_URL: ${{ vars.JF_URL }} # This variable is configured org wide
        with:
          oidc-provider-name: github

      - name: Install Dependencies
        run: pnpm install --prefer-offline
        env:
          ARTIFACTORY_TOKEN: ${{ steps.jfrog.outputs.oidc-token }}
          NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/.npmrc.gha

      - name: Run Syncpack
        run: pnpm run syncpack lint
